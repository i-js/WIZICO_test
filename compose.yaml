name: collaborative-todo
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo_dev_password
      POSTGRES_DB: todo
    ports:
      - '127.0.0.1:5544:5432'
    volumes:
      - todo_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U todo -d todo']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://todo:todo_dev_password@db:5432/todo?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-before-deploy-at-least-32-characters}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3100,http://127.0.0.1:3100}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 3101
    ports:
      - '127.0.0.1:3101:3101'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3101}
    ports:
      - '127.0.0.1:3100:3100'
    depends_on:
      api:
        condition: service_healthy
volumes:
  todo_data:
